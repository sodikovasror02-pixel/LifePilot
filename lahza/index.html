<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Лаҳза — шабакаи суратҳо: пост, сторис, лайк, шарҳ ва профил.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Лаҳза</title>
<style>
:root{
  --bg:#fff;--surface:#fff;--ink:#0f1115;--muted:#6b7280;--line:#e6e8ec;--soft:#f3f4f6;
  --accent:#e11d48;--link:#2563eb;
  --ring:linear-gradient(45deg,#f59e0b,#e11d48 55%,#7c3aed);
  --nav-h:56px;--top-h:52px;
}
body.dark{--bg:#0b0c0f;--surface:#121318;--ink:#f3f4f6;--muted:#9ca3af;--line:#25272e;--soft:#1b1d23;--link:#60a5fa}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:none}
input:focus,textarea:focus{outline:2px solid var(--link);outline-offset:-1px}
button:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:6px}
svg{display:block}
.app{max-width:470px;margin:0 auto;min-height:100vh;min-height:100dvh;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--bg);position:relative;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
@media (max-width:470px){.app{border:0}}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;height:var(--top-h);display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-size:24px;font-weight:800;letter-spacing:-.5px;background:var(--ring);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar h1{font-size:17px;margin:0;font-weight:700}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;position:relative}
.icon-btn:active{background:var(--soft)}
.dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:470px;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:center;background:var(--bg);border-top:1px solid var(--line)}
.nav button{width:52px;height:44px;display:grid;place-items:center;position:relative}
.nav button.active svg{stroke-width:2.6}
.nav .mini-ava{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid transparent}
.nav button.active .mini-ava{border-color:var(--ink)}

.page{display:none}.page.active{display:block}

/* avatar */
.ava{border-radius:50%;object-fit:cover;background:var(--soft);flex:none}
.ring{padding:2px;border-radius:50%;background:var(--ring);display:inline-block}
.ring.seen{background:var(--line)}
.ring>.inner{display:block;padding:2px;border-radius:50%;background:var(--bg)}
.ring .ava{display:block}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:12px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;flex:none}
.story span{font-size:12px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.story .add-wrap{position:relative}
.story button{display:block;line-height:0}
.story .plus{position:absolute;right:0;bottom:0;width:22px;height:22px;border-radius:50%;background:var(--link);color:#fff;border:2px solid var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;line-height:1}

/* posts */
.post{border-bottom:1px solid var(--line);padding-bottom:10px}
.post-head{display:flex;align-items:center;gap:10px;padding:10px 12px}
.post-head .who{flex:1;min-width:0}
.post-head .name{font-weight:700;font-size:14px}
.post-head .loc{font-size:12px;color:var(--muted)}
.media{position:relative;background:var(--soft);user-select:none;-webkit-user-select:none;overflow:hidden}
.media img{width:100%;display:block;max-height:585px;object-fit:cover}
.big-heart{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.big-heart.go{animation:pop .8s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.big-heart.go{animation:fade .6s}@keyframes fade{0%,60%{opacity:1}100%{opacity:0}}}
.actions{display:flex;align-items:center;gap:6px;padding:6px 8px 0}
.actions .sp{flex:1}
.actions button{width:40px;height:40px;display:grid;place-items:center}
.liked svg{fill:var(--accent);stroke:var(--accent)}
.saved svg{fill:var(--ink)}
.likes{font-weight:700;font-size:14px;padding:0 14px}
.caption{padding:4px 14px 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.caption b{margin-right:5px}
.tag{color:var(--link);cursor:pointer}
.more-comments{padding:4px 14px 0;color:var(--muted);font-size:14px;display:block}
.time{padding:4px 14px 0;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid button{aspect-ratio:1;position:relative;overflow:hidden;background:var(--soft)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .ov{position:absolute;inset:0;background:#0007;color:#fff;display:none;align-items:center;justify-content:center;gap:14px;font-weight:700;font-size:14px}
@media (hover:hover){.grid button:hover .ov{display:flex}}

/* explore */
.search{padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.user-row{display:flex;align-items:center;gap:12px;padding:8px 14px;width:100%;text-align:left}
.user-row .n{font-weight:700;font-size:14px}.user-row .s{color:var(--muted);font-size:13px}

/* profile */
.prof{padding:16px 16px 8px}
.prof-top{display:flex;align-items:center;gap:22px}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px}.stats span{font-size:13px;color:var(--muted)}
.bio{margin-top:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bio b{display:block}
.prof-btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;background:var(--soft);border-radius:9px;padding:8px 12px;font-weight:650;font-size:14px;text-align:center}
.btn.primary{background:var(--link);color:#fff}
.btn.danger{color:#dc2626}
.tabs{display:flex;border-top:1px solid var(--line);margin-top:8px}
.tabs button{flex:1;height:46px;display:grid;place-items:center;color:var(--muted);border-top:1px solid transparent;margin-top:-1px}
.tabs button.on{color:var(--ink);border-top-color:var(--ink)}

.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty h3{color:var(--ink);margin:12px 0 6px;font-size:18px}
.empty .circle{width:72px;height:72px;margin:0 auto;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.empty .btn{display:inline-block;flex:none;margin-top:14px}

/* activity */
.act{display:flex;align-items:center;gap:12px;padding:10px 14px}
.act p{margin:0;flex:1;font-size:14px;overflow-wrap:anywhere}
.act .t{color:var(--muted)}
.act img.th{width:44px;height:44px;object-fit:cover;flex:none}
.sec-h{padding:14px 14px 4px;font-weight:700;font-size:15px}

/* sheets & modals */
.overlay{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:470px;max-height:88dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);gap:8px}
.sheet-h h2{font-size:16px;margin:0;flex:1;text-align:center}
.sheet-h .txt-btn{color:var(--link);font-weight:700;padding:6px 8px;min-width:64px}
.sheet-h .txt-btn:disabled{opacity:.4}
.sheet-b{overflow-y:auto;flex:1}
.full .sheet{max-height:100dvh;height:100dvh;border-radius:0}
.menu button{display:block;width:100%;padding:15px;text-align:center;border-bottom:1px solid var(--line);font-size:15px}
.menu button.red{color:#dc2626;font-weight:700}
.comment{display:flex;gap:10px;padding:10px 14px}
.comment p{margin:0;font-size:14px;flex:1;overflow-wrap:anywhere;white-space:pre-wrap}
.comment small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.comment .del{color:var(--muted);font-size:12px;margin-left:10px}
.c-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.c-form input{border-radius:999px}
.c-form button{color:var(--link);font-weight:700;padding:6px}
.c-form button:disabled{opacity:.4}

/* create */
.preview{background:#000;position:relative}
.preview img{width:100%;display:block;max-height:60dvh;object-fit:contain;margin:auto}
.filters{display:flex;gap:10px;overflow-x:auto;padding:12px;scrollbar-width:none}
.filters button{flex:none;width:76px;text-align:center;font-size:12px;color:var(--muted)}
.filters button img{width:76px;height:76px;object-fit:cover;border-radius:6px;margin-bottom:5px;border:2px solid transparent}
.filters button.on{color:var(--ink);font-weight:700}
.filters button.on img{border-color:var(--link)}
.field{padding:8px 12px}
.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}
.pick{padding:40px 20px;text-align:center}
.pick .btn{display:inline-block;flex:none;padding:10px 18px;margin-top:16px}
.seg{display:flex;gap:6px;padding:0 12px 4px}
.seg button{flex:1;padding:7px;border-radius:8px;background:var(--soft);font-size:13px;font-weight:650}
.seg button.on{background:var(--ink);color:var(--bg)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

/* story viewer */
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:none;color:#fff}
.viewer.open{display:block}
.viewer .stage{position:absolute;inset:0;max-width:470px;margin:auto}
#vImg{width:100%;height:100%;object-fit:contain}
.bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:2}
.bars div{flex:1;height:3px;background:#ffffff55;border-radius:2px;overflow:hidden}
.bars i{display:block;height:100%;width:0;background:#fff}
.v-head{position:absolute;top:22px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:2;text-shadow:0 1px 3px #0008}
.v-head .n{font-weight:700;font-size:14px}.v-head .t{opacity:.8;font-size:13px;flex:1}
.v-head button{color:#fff;width:40px;height:40px;display:grid;place-items:center}
.v-tap{position:absolute;top:70px;bottom:0;width:35%;z-index:1}
.v-tap.l{left:0}.v-tap.r{right:0;width:65%}

/* onboarding */
.onb{padding:40px 24px;max-width:400px;margin:auto}
.onb .logo{font-size:44px;text-align:center;display:block}
.onb p{text-align:center;color:var(--muted)}
.onb form{display:grid;gap:12px;margin-top:24px}
.onb .ava-pick{display:flex;flex-direction:column;align-items:center;gap:8px}
.onb .ava-pick button{color:var(--link);font-weight:650;font-size:14px}
.err{color:#dc2626;font-size:13px;margin-top:4px;min-height:1em}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Onboarding -->
  <section class="page" id="p-onb">
    <div class="onb">
      <span class="logo">Лаҳза</span>
      <p>Лаҳзаҳои зиндагиатонро бо суратҳо нигоҳ доред ва мубодила кунед.</p>
      <form id="onbForm" novalidate>
        <div class="ava-pick">
          <img id="onbAva" class="ava" width="88" height="88" alt="Сурати профил">
          <button type="button" id="onbAvaBtn">Интихоби сурати профил</button>
        </div>
        <div>
          <label for="onbName" style="font-size:13px;font-weight:650">Ном</label>
          <input id="onbName" autocomplete="name" placeholder="масалан, Асрор Содиқов">
        </div>
        <div>
          <label for="onbUser" style="font-size:13px;font-weight:650">Номи корбар</label>
          <input id="onbUser" autocomplete="username" placeholder="масалан, asror_s" autocapitalize="off">
          <div class="err" id="onbErr"></div>
        </div>
        <button class="btn primary" type="submit" style="padding:12px">Сохтани профил</button>
      </form>
    </div>
  </section>

  <!-- Home -->
  <section class="page" id="p-home">
    <div class="topbar">
      <span class="logo">Лаҳза</span>
      <div style="display:flex">
        <button class="icon-btn" data-go="activity" aria-label="Огоҳиҳо"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.3 5 6.8 5c2.2 0 3.6 1.2 5.2 3 1.6-1.8 3-3 5.2-3 3.5 0 5.6 3.6 4.3 6.8C19.5 16.4 12 21 12 21z"/></svg><span class="dot" id="actDot" hidden></span></button>
      </div>
    </div>
    <div class="stories" id="stories"></div>
    <div id="feed"></div>
  </section>

  <!-- Explore -->
  <section class="page" id="p-explore">
    <div class="search"><label class="sr" for="q">Ҷустуҷӯ</label><input id="q" type="search" placeholder="Ҷустуҷӯи одамон ва #ҳештегҳо" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
    <div id="exploreUsers"></div>
    <div class="grid" id="exploreGrid"></div>
  </section>

  <!-- Activity -->
  <section class="page" id="p-activity">
    <div class="topbar"><button class="icon-btn" data-go="home" aria-label="Бозгашт"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Огоҳиҳо</h1><span style="width:40px"></span></div>
    <div id="activity"></div>
  </section>

  <!-- Profile -->
  <section class="page" id="p-profile">
    <div class="topbar">
      <button class="icon-btn" id="profBack" aria-label="Бозгашт" hidden><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="profTitle"></h1>
      <button class="icon-btn" id="profMenu" aria-label="Танзимот"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div id="profile"></div>
  </section>

  <nav class="nav" id="nav" hidden>
    <button data-go="home" aria-label="Асосӣ"><svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
    <button data-go="explore" aria-label="Ҷустуҷӯ"><svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button id="navCreate" aria-label="Пости нав"><svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg></button>
    <button data-go="activity" aria-label="Огоҳиҳо"><svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.3 5 6.8 5c2.2 0 3.6 1.2 5.2 3 1.6-1.8 3-3 5.2-3 3.5 0 5.6 3.6 4.3 6.8C19.5 16.4 12 21 12 21z"/></svg><span class="dot" id="navDot" hidden></span></button>
    <button data-go="profile" aria-label="Профил"><img class="mini-ava" id="navAva" alt=""></button>
  </nav>
</div>

<!-- generic overlay -->
<div class="overlay" id="ov" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<!-- story viewer -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Сторис">
  <div class="stage">
    <img id="vImg" alt="">
    <div class="bars" id="vBars"></div>
    <div class="v-head">
      <img class="ava" id="vAva" width="32" height="32" alt="">
      <span class="n" id="vName"></span><span class="t" id="vTime"></span>
      <button id="vDel" aria-label="Нест кардан" hidden><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      <button id="vClose" aria-label="Пӯшидан"><svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="v-tap l" id="vPrev" aria-label="Қаблӣ"></button>
    <button class="v-tap r" id="vNext" aria-label="Баъдӣ"></button>
  </div>
</div>

<input type="file" id="filePost" accept="image/*" hidden>
<input type="file" id="fileStory" accept="image/*" hidden>
<input type="file" id="fileAva" accept="image/*" hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ================= Storage (IndexedDB) ================= */
const DB_NAME = 'lahza', DB_VER = 1;
let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('kv');
      d.createObjectStore('posts', {keyPath:'id'});
      d.createObjectStore('stories', {keyPath:'id'});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode), s = t.objectStore(store);
    let out; const r = fn(s); if (r) r.onsuccess = () => out = r.result;
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const kvGet = k => tx('kv','readonly', s => s.get(k));
const kvSet = (k,v) => tx('kv','readwrite', s => s.put(v,k));
const all = st => tx(st,'readonly', s => s.getAll());
const put = (st,v) => tx(st,'readwrite', s => s.put(v));
const del = (st,id) => tx(st,'readwrite', s => s.delete(id));
const clear = st => tx(st,'readwrite', s => s.clear());

/* ================= State ================= */
const S = {
  me:null,             // {id,name,username,bio,avatar}
  users:{},            // id -> user (includes me)
  following:[],        // ids
  saved:[],            // post ids
  notifs:[],           // {id,type,from,postId,text,at,read}
  posts:[],            // sorted desc
  stories:[],
  seenStories:[],
  dark:false,
  page:'home', profileId:null, profTab:'posts', exploreTag:'',
};
async function saveMeta(){
  await kvSet('meta', {me:S.me, users:S.users, following:S.following, saved:S.saved, notifs:S.notifs.slice(0,200), seenStories:S.seenStories, dark:S.dark});
}

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

const DAY = 864e5;
function ago(t){
  const s = Math.max(0, (Date.now()-t)/1000);
  if (s < 60) return 'ҳозир';
  if (s < 3600) return Math.floor(s/60) + ' дақ';
  if (s < 86400) return Math.floor(s/3600) + ' соат';
  if (s < 604800) return Math.floor(s/86400) + ' рӯз';
  return new Date(t).toLocaleDateString('ru-RU', {day:'numeric', month:'short', year:'numeric'});
}
function rich(text){ // escape, then link #tags and @mentions
  return esc(text).replace(/(^|\s)([#@][\p{L}\p{N}_]+)/gu, (m, sp, tag) => `${sp}<span class="tag" data-tag="${tag}">${tag}</span>`);
}

function defaultAva(name){
  const c = document.createElement('canvas'); c.width = c.height = 160; const x = c.getContext('2d');
  const hues = [340, 20, 200, 260, 160, 40]; const h = hues[(name.charCodeAt(0)||0) % hues.length];
  const g = x.createLinearGradient(0,0,160,160); g.addColorStop(0, `hsl(${h} 80% 60%)`); g.addColorStop(1, `hsl(${h+40} 70% 45%)`);
  x.fillStyle = g; x.fillRect(0,0,160,160);
  x.fillStyle = '#fff'; x.font = 'bold 72px system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText((name.trim()[0]||'?').toUpperCase(), 80, 86);
  return c.toDataURL('image/jpeg', .85);
}
function ava(u, size, ring){
  const img = `<img class="ava" src="${esc(u.avatar)}" width="${size}" height="${size}" alt="">`;
  if (!ring) return img;
  return `<span class="ring ${ring==='seen'?'seen':''}"><span class="inner">${img}</span></span>`;
}
function readFile(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
/* Resize image; mode: 'square' | 'original' | 'story' (9:16 crop) */
async function processImage(file, mode, max=1080){
  const img = await loadImg(await readFile(file));
  let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
  let ratio = sw/sh;
  if (mode === 'square') ratio = 1;
  else if (mode === 'story') ratio = 9/16;
  else ratio = Math.min(1.91, Math.max(0.8, ratio)); // between 4:5 and 1.91:1
  if (sw/sh > ratio){ const nw = sh*ratio; sx = (sw-nw)/2; sw = nw; } else { const nh = sw/ratio; sy = (sh-nh)/2; sh = nh; }
  const W = Math.min(max, Math.round(sw)), H = Math.round(W/ratio);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
  return c.toDataURL('image/jpeg', .85);
}

function demoImage(seed, w=1080, h=1080){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  const r = n => { seed = (seed*9301+49297)%233280; return seed/233280*n; };
  const h1 = r(360), h2 = (h1+60+r(120))%360;
  const g = x.createLinearGradient(0,0,w,h); g.addColorStop(0,`hsl(${h1} 70% 62%)`); g.addColorStop(1,`hsl(${h2} 65% 40%)`);
  x.fillStyle = g; x.fillRect(0,0,w,h);
  // sun
  x.fillStyle = `hsla(${(h1+30)%360} 100% 85% / .9)`; x.beginPath(); x.arc(w*(.25+r(.5)), h*(.2+r(.25)), w*(.08+r(.08)), 0, 7); x.fill();
  // mountains layers
  for (let L=0; L<3; L++){
    x.fillStyle = `hsla(${h2} 40% ${30-L*8}% / ${.55+L*.2})`;
    x.beginPath(); x.moveTo(0,h); let y = h*(.55+L*.12);
    for (let px=0; px<=w; px+=w/8){ x.lineTo(px, y - r(h*.18)); }
    x.lineTo(w,h); x.closePath(); x.fill();
  }
  return c.toDataURL('image/jpeg', .8);
}

function liveStories(){ return S.stories.filter(s => Date.now() - s.createdAt < DAY).sort((a,b) => a.createdAt - b.createdAt); }
function storyGroups(){
  const live = liveStories(), map = new Map();
  for (const s of live){ if (s.userId===S.me.id || S.following.includes(s.userId)){ if (!map.has(s.userId)) map.set(s.userId, []); map.get(s.userId).push(s); } }
  const groups = [...map.entries()].map(([userId, items]) => ({userId, items, seen: items.every(i => S.seenStories.includes(i.id))}));
  groups.sort((a,b) => (a.userId===S.me.id ? -1 : b.userId===S.me.id ? 1 : a.seen - b.seen));
  return groups;
}
function renderStories(){
  const groups = storyGroups(); const mine = groups.find(g => g.userId===S.me.id);

}
const V = {groups:[], gi:0, si:0, t:0, start:0, raf:0, paused:false, DUR:5000};
function openStories(groups, gi){
  if (gi < 0) return; V.groups = groups; V.gi = gi; V.si = 0;
  const g = groups[gi]; const firstUnseen = g.items.findIndex(i => !S.seenStories.includes(i.id)); V.si = firstUnseen > 0 ? firstUnseen : 0;
  $('#viewer').classList.add('open'); document.body.style.overflow = 'hidden'; showStory();
}
function showStory(){
  const g = V.groups[V.gi], s = g.items[V.si], u = user(g.userId);
  $('#vImg').src = s.image; $('#vAva').src = u.avatar; $('#vName').textContent = u.username; $('#vTime').textContent = ago(s.createdAt);
  $('#vDel').hidden = g.userId !== S.me.id;
  $('#vBars').innerHTML = g.items.map((_,i) => `<div><i style="width:${i<V.si?100:0}%"></i></div>`).join('');
  if (!S.seenStories.includes(s.id)){ S.seenStories.push(s.id); saveMeta(); }
  V.start = performance.now(); cancelAnimationFrame(V.raf); tick();
}
function tick(){
  const bar = $('#vBars').children[V.si]?.firstChild; if (!bar) return;
  const p = Math.min(1, (performance.now() - V.start) / V.DUR); bar.style.width = (p*100)+'%';
  if (p >= 1) return nextStory();
  V.raf = requestAnimationFrame(tick);
}
function nextStory(){
  const g = V.groups[V.gi];
  if (V.si < g.items.length-1) { V.si++; showStory(); }
  else if (V.gi < V.groups.length-1) { V.gi++; V.si = 0; showStory(); }
  else closeStories();
}
function prevStory(){
  if (V.si > 0) V.si--; else if (V.gi > 0){ V.gi--; V.si = V.groups[V.gi].items.length-1; }
  showStory();
}
function closeStories(){ cancelAnimationFrame(V.raf); $('#viewer').classList.remove('open'); document.body.style.overflow = ''; if (S.page==='home') renderStories(); }
$('#vNext').onclick = nextStory; $('#vPrev').onclick = prevStory; $('#vClose').onclick = closeStories;
$('#vDel').onclick = async () => {

  try {
    const blob = await (await fetch(p.image)).blob();

function renderExplore(){

  const top = Object.entries(tags).sort((a,b) => b[1]-a[1]).slice(0,10).map(x => x[0]);

  let users = [];

  $('#exploreUsers').innerHTML = users.map(u => `<button class="user-row" data-user="${u.id}">${ava(u,44)}<span><span class="n">${esc(u.username)}</span><br><span class="s">${esc(u.name)}${u.id===S.me.id?' · шумо':S.following.includes(u.id)?' · пайравӣ мекунед':''}</span></span></button>`).join('');

function validUsername(v, selfId){
  v = v.trim().toLowerCase();
  if (!v) return 'Номи корбарро нависед.';
  if (!/^[a-z0-9._]{3,30}$/.test(v)) return 'Аз 3 то 30 ҳарфи лотинӣ, рақам, нуқта ё «_» истифода баред.';
  if (Object.values(S.users).some(u => u.username === v && u.id !== selfId)) return 'Ин ном аллакай банд аст — дигарашро интихоб кунед.';
  return '';
}

async function exportData(){
  const data = {app:'lahza', v:1, exportedAt:new Date().toISOString(), meta:await kvGet('meta'), posts:await all('posts'), stories:await all('stories')};
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
  a.download = `lahza-backup-${new Date().toISOString().slice(0,10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);

$('#fileImport').onchange = async e => {

    await clear('posts'); await clear('stories'); await kvSet('meta', d.meta);
    for (const p of d.posts||[]) await put('posts', p); for (const s of d.stories||[]) await put('stories', s);

  const upd = () => { if (!onbAva) $('#onbAva').src = defaultAva($('#onbName').value || '?'); };
  upd(); $('#onbName').oninput = upd;
  $('#onbAvaBtn').onclick = () => { S.onAva = d => { onbAva = d; $('#onbAva').src = d; }; $('#fileAva').click(); };
  $('#onbUser').oninput = () => $('#onbErr').textContent = '';
  $('#onbUser').onblur = () => { if ($('#onbUser').value) $('#onbErr').textContent = validUsername($('#onbUser').value) || ''; };
  $('#onbForm').onsubmit = async e => {
    e.preventDefault();
    const un = $('#onbUser').value.trim().toLowerCase(), err = validUsername(un);
    if (err){ $('#onbErr').textContent = err; $('#onbUser').focus(); return; }
    const name = $('#onbName').value.trim() || un;
    S.me = {id:'me_'+uid(), name, username:un, bio:'', avatar: onbAva || defaultAva(name)};
    S.users[S.me.id] = S.me; await saveMeta(); await boot();
  };
}

/* ================= Boot ================= */
async function boot(){
  const meta = await kvGet('meta');
  if (meta) Object.assign(S, meta);
  applyTheme();
  if (!S.me){
    // first run: seed demo accounts so the app isn't empty, then ask for a profile
    if (!Object.keys(S.users).length){ await seedDemo(); await saveMeta(); }
    return showOnboarding();
  }
  S.posts = (await all('posts')).sort((a,b) => b.createdAt - a.createdAt);
  S.stories = await all('stories');
  // drop expired stories
  for (const s of S.stories.filter(s => Date.now()-s.createdAt >= DAY)) await del('stories', s.id);
  S.stories = S.stories.filter(s => Date.now()-s.createdAt < DAY);
  $('#navAva').src = S.me.avatar;
  updateDots(); go('home');
}
openDB().then(d => { db = d; return boot(); }).catch(err => {
  document.body.innerHTML = `<div class="empty"><h3>Барнома кушода нашуд</h3><p>Браузер иҷозати нигоҳ доштани маълумотро намедиҳад (масалан, дар реҷаи махфӣ). Онро дар реҷаи оддӣ кушоед.</p></div>`;
  console.error(err);
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('service-worker.js').catch(() => {});
</script>
</body>
</html>
